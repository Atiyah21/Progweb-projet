---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-login
  template:
    metadata:
      labels:
        app: service-login
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done']
      containers:
        - name: service-login
          image: atiyah/service_login:v7
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/mydb"
            - name: SPRING_DATASOURCE_USERNAME 
              value: "aynav"  # <-- Changé pour correspondre à PostgreSQL
            - name: SPRING_DATASOURCE_PASSWORD
              value: "aynav"  # <-- Changé pour correspondre à PostgreSQL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service2
  template:
    metadata:
      labels:
        app: service2
    spec:
      containers:
        - name: service2
          image: navdeep00/service2:v2
          ports:
            - containerPort: 8080

